<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>เครื่องคำนวณ พันเก้าเล่า V2</title>
  <style>
    :root { --primary: #2c3e50; --accent: #3498db; --bg: #ecf0f1; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; }
    .calc-card { background: #34495e; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 100%; max-width: 400px; color: white; }
    .screen { background: #bdc3c7; color: #2c3e50; padding: 15px; border-radius: 10px; text-align: right; margin-bottom: 20px; min-height: 60px; }
    .screen .val { font-size: 24px; font-weight: bold; display: block; }
    .screen .unit { font-size: 14px; opacity: 0.8; }
    .grid-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    button { padding: 15px; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; transition: 0.2s; background: #5d6d7e; color: white; }
    button:hover { opacity: 0.8; }
    button.op { background: var(--accent); }
    button.wide { grid-column: span 2; background: #e67e22; }
    select { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: none; background: #ecf0f1; }
    .label { font-size: 12px; margin-bottom: 5px; display: block; color: #bdc3c7; }
    .result-area { margin-top: 20px; background: rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; font-size: 14px; }
    footer { text-align: center; margin-top: 15px; font-size: 11px; color: #bdc3c7; }
  </style>
</head>
<body>

<div class="calc-card">
  <h2 style="text-align:center; margin-top:0;">พันเก้าเล่า Calc</h2>
  
  <label class="label">โหมดการวัด</label>
  <select id="mode">
    <option value="mass">น้ำหนัก (งอบ/เงิบ)</option>
    <option value="length">ระยะทาง (ทาง/ทาบ)</option>
    <option value="currency">เงิน (เจ๋ง/เหรียญ)</option>
  </select>

  <div class="screen">
    <div class="unit" id="unitDisplay">เตรียมคำนวณ...</div>
    <div class="val" id="display">0</div>
  </div>

  <div class="grid-btns">
    <button onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button>
    <button class="op" onclick="setOp('kg')">KG</button>
    
    <button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button>
    <button class="op" onclick="setOp('ngob')">งอบ</button>
    
    <button onclick="press('1')">1</button><button onclick="press('2')">2</button><button onclick="press('3')">3</button>
    <button class="op" onclick="setOp('ngeib')">เงิบ</button>
    
    <button onclick="press('0')">0</button><button onclick="press('.')">.</button>
    <button style="background:#c0392b" onclick="clr()">C</button>
    <button class="op" onclick="calculate()">=</button>
    
    <button class="wide" onclick="calculate()">แปลงค่าทันที</button>
    <button class="wide" style="background:#27ae60" id="jeungConvert">1 เจ๋ง = 0.6</button>
  </div>

  <div class="result-area" id="result">
    รอกดตัวเลขและเลือกหน่วย...
  </div>

  <footer>ข้อมูล ยุคพันเก้าเล่า ที่มีการเปลี่ยนแปลง</footer>
</div>

<script>
  let currentInput = "";
  const display = document.getElementById('display');
  const resultArea = document.getElementById('result');

  function press(num) {
    currentInput += num;
    display.innerText = currentInput;
  }

  function clr() {
    currentInput = "";
    display.innerText = "0";
    resultArea.innerText = "ล้างข้อมูลแล้ว";
  }

  function calculate() {
    let val = parseFloat(currentInput);
    if (isNaN(val)) return;

    let mode = document.getElementById('mode').value;
    let resText = "";

    if (mode === "mass") {
      // 1 งอบ = 2kg, 1 เงิบ = 1g
      let kg = val; 
      resText = `${val} กิโล = ${val/2} งอบ | ${val*1000} เงิบ`;
    } else if (mode === "length") {
      // 1 ทาบ = 10m, 1 ทาง = 1000m
      resText = `${val} เมตร = ${val/10} ทาบ | ${val/1000} ทาง`;
    } else if (mode === "currency") {
      // 1 เจ๋ง = 0.6 ตามคำสั่งใหม่
      resText = `${val} เจ๋ง (เดิม) = ${val * 0.6} เจ๋ง (ใหม่)`;
    }

    resultArea.innerText = resText;
  }

  // ฟังก์ชันพิเศษสำหรับ 1 เจ๋ง = 0.6 เจ๋ง
  document.getElementById('jeungConvert').onclick = function() {
    let val = parseFloat(currentInput) || 1;
    let converted = val * 0.6;
    resultArea.innerText = `แปลงเงิน: ${val} เจ๋ง => ${converted.toFixed(2)} เจ๋ง`;
  };
</script>

</body>
</html>
