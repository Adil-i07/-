<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เครื่องแปลงค่า・ใหม่</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#252627;--k:#6b6c6d;--kl:#9a9b9c;--or:#ff9500;--tx:#fff;--dim:#8a8b8c;--page:#111}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--page:#e6e6ea}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--page);font-family:-apple-system,"Sukhumvit Set","Noto Sans Thai",system-ui,sans-serif;color:var(--tx);padding:12px}
.calc{width:100%;max-width:340px;background:var(--bg);border-radius:28px;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.calc{touch-action:none;user-select:none;-webkit-user-select:none;position:relative;overflow:hidden}
.head{text-align:center;margin-bottom:6px}
.title{font-size:16px;color:#ddd;min-height:22px}
.dots{display:flex;justify-content:center;gap:6px;margin:6px 0 2px}
.dots i{width:7px;height:7px;border-radius:50%;background:#4a4b4c;transition:.2s}
.dots i.on{background:var(--or);width:18px;border-radius:4px}
.hint{font-size:11px;color:var(--dim)}
.row{transition:transform .25s,opacity .25s}
.row.out-l{transform:translateX(-40px);opacity:0}.row.out-r{transform:translateX(40px);opacity:0}
.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-80px);background:#fff;color:#111;padding:8px 14px;border-radius:18px;font-size:13px;transition:transform .3s;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
.row{text-align:right;padding:4px 6px}
.num{font-size:48px;font-weight:300;line-height:1.1;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
#top .num{color:#e8e8e8}#bot .num{color:#9d9e9f}
.sel{display:inline-flex;align-items:center;gap:4px;margin-top:2px;color:var(--dim);font-size:14px;position:relative}
.sel select{background:#4a4b4c;color:#ddd;border:0;border-radius:6px;font:inherit;font-size:13px;padding:2px 4px;max-width:200px;cursor:pointer}
.mid{display:flex;align-items:center;gap:10px;margin:6px 6px}
.mid hr{flex:1;border:0;border-top:1px solid #3a3b3c;margin:0}
.swap{background:none;border:0;color:var(--or);font-size:22px;cursor:pointer;padding:0}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.pad button{aspect-ratio:1;border:0;border-radius:50%;background:var(--k);color:#fff;font-size:28px;font-family:inherit;cursor:pointer;transition:filter .1s}
.pad button:active{filter:brightness(1.35)}
.pad .f{background:var(--kl)}.pad .o{background:var(--or);font-size:32px}.pad .o.act{background:#fff;color:var(--or)}
.toast{position:fixed;z-index:30;top:calc(14px + env(safe-area-inset-top,0px))}
.res{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--page);padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.res[hidden]{display:none}
#card{width:100%;max-width:420px}#card svg{width:100%;height:auto;display:block;border-radius:28px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.path{font-size:13px;color:var(--dim);font-family:ui-monospace,monospace}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btns button{border:0;border-radius:20px;padding:10px 16px;font:inherit;font-size:14px;background:var(--k);color:#fff;cursor:pointer}
.btns .p{background:var(--or)}
.hint{min-height:14px}
#grid[hidden]{display:none}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-height:min(62vh,440px);overflow-y:auto;touch-action:pan-y;padding:8px 2px;margin-top:6px;text-align:left}
.tile{position:relative;padding:2px;border-radius:14px;cursor:pointer;background:linear-gradient(135deg,var(--or),#ffc266);transition:transform .15s}
.tile:active{transform:scale(.96)}
.tile img{display:block;width:100%;aspect-ratio:3/2;object-fit:contain;background:rgba(255,255,255,.85);border-radius:12px;-webkit-user-drag:none;pointer-events:none}
.tag{position:absolute;right:6px;bottom:6px;background:#fff;color:#111;border-radius:999px;padding:0 8px;font-weight:700;font-size:12px;pointer-events:none}
#viewer{position:fixed;inset:0;z-index:25;touch-action:none;overflow:hidden;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;user-select:none;-webkit-user-select:none}
#viewer.open{opacity:1;visibility:visible}
#vbg{position:absolute;inset:-15%;background-size:cover;background-position:center;filter:blur(46px) saturate(1.4);transform:scale(1.1)}
#vshade{position:absolute;inset:0;background:rgba(0,0,0,.35)}
#vimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:6vmin;filter:drop-shadow(0 10px 30px rgba(0,0,0,.35));will-change:transform;-webkit-user-drag:none}
#vhint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 6px rgba(0,0,0,.5);transition:opacity .6s;pointer-events:none;padding:0 16px}
</style>
</head>
<body>
<div class="calc">
  <div class="toast" id="toast"></div>
  <div class="head"><div class="title" id="title"></div><div class="dots" id="dots"></div><div class="hint" id="hint"></div></div>
  <div id="convBody">
  <div class="row" id="top"><div class="num" id="n1">0</div><div class="sel"><select id="u1"></select></div></div>
  <div class="mid"><button class="swap" id="swap" title="สลับ">⇅</button><hr></div>
  <div class="row" id="bot"><div class="num" id="n2">0</div><div class="sel"><select id="u2"></select></div></div>
  <div class="pad" id="pad"></div>
  </div>
  <div class="row" id="grid" hidden></div>
</div>
<div id="viewer" aria-label="ดูรูป"><div id="vbg"></div><div id="vshade"></div><img id="vimg" alt="" draggable="false"><div id="vhint">ปัดซ้าย/ขวาเปลี่ยนรูป · ปัดขึ้นแชร์ · ปัดลงย้อนกลับ</div></div>
<div class="res" id="res" hidden><div id="card"></div><div class="path" id="path"></div><div class="btns"><button class="p" id="bShare">แชร์รูปคำตอบ</button><button id="bLink">คัดลอกลิงก์</button><button id="bOpen">เปิดเครื่องแปลง</button></div></div>
<script>
const units = {
  weight: [
    { name: 'เจ๋ง', code:'j', val: 1 },{ name: 'เหรียญ', code:'c', val: 0.6 },{ name: 'โงบ', code:'o', val: 1/50 },
    { name: 'เมตริกตัน', code:'t', val: 1/50 },{ name: 'งอบ', code:'n', val: 10 },{ name: 'กิโลกรัม', code:'k', val: 20 },
    { name: 'เงิบ (กรัม)', code:'g', val: 20000 },{ name: 'ง่อย', code:'y', val: 20000000 }
  ],
  distance: [
    { name: 'ทาง', code:'t', val: 1 },{ name: 'เมตร', code:'m', val: 1000 },{ name: 'ทาบ', code:'b', val: 100 },
    { name: 'เทียบ', code:'p', val: 1000 },{ name: 'เซนติเมตร', code:'c', val: 100000 },{ name: 'เกิบ', code:'k', val: 10000 }
  ],
  currency: [
    { name: 'เจ๋ง (J̵)', code:'j', val: 1 },{ name: 'ดอลลาร์ ($)', code:'d', val: 0.67 },{ name: 'บาทไทย (฿)', code:'b', val: 20 }
  ]
};
units.money=[];
const cats = {weight:'น้ำหนัก',distance:'ระยะทาง',currency:'สกุลเงิน',money:'รูปเงิน'};
let cat='weight',cur='0',acc=null,op=null,fresh=false;
const $=id=>document.getElementById(id);
const sym={'÷':'÷','×':'×','−':'−','+':'+'};

function fmtIn(s){const [i,d]=s.split('.');const neg=i[0]==='-';const ii=(neg?i.slice(1):i).replace(/\B(?=(\d{3})+(?!\d))/g,',');return (neg?'-':'')+ii+(d!==undefined?'.'+d:'')}
function fmtOut(x){
  if(!isFinite(x))return 'ผิดพลาด';
  if(x===0)return '0';
  const a=Math.abs(x);
  if(a>=1e15||a<1e-6)return x.toExponential(4);
  let s=x.toLocaleString('en-US',{maximumFractionDigits:6});
  return s;
}
function fit(el){const l=el.textContent.length;el.style.fontSize=(l>12?Math.max(22,48-(l-12)*3):48)+'px'}
function render(){
  applyMode();if(cat==='money')return;
  $('n1').textContent=fmtIn(cur);
  const v=parseFloat(cur),a=units[cat][$('u1').selectedIndex],b=units[cat][$('u2').selectedIndex];
  $('n2').textContent=fmtOut(v/a.val*b.val);
  fit($('n1'));fit($('n2'));
  document.querySelectorAll('.o[data-k]').forEach(b=>b.classList.toggle('act',fresh&&op===b.dataset.k));
}
function calc(a,o,b){switch(o){case '+':return a+b;case '−':return a-b;case '×':return a*b;case '÷':return b===0?NaN:a/b}}
function clean(n){return isNaN(n)?'0':String(parseFloat(n.toPrecision(12)))}
function press(k){
  if(/^\d$/.test(k)){if(fresh){cur='0';fresh=false}if(cur.replace(/[-.]/g,'').length>=12)return;cur=cur==='0'?k:cur==='-0'?'-'+k:cur+k}
  else if(k==='.'){if(fresh){cur='0';fresh=false}if(!cur.includes('.'))cur+='.'}
  else if(k==='AC'){cur='0';acc=null;op=null;fresh=false}
  else if(k==='⌫'){if(fresh)return;cur=cur.length>1&&!(cur.length===2&&cur[0]==='-')?cur.slice(0,-1):'0'}
  else if(k==='±'){cur=cur==='0'?'0':cur[0]==='-'?cur.slice(1):'-'+cur}
  else if(k==='%'){cur=clean(parseFloat(cur)/100)}
  else if(k==='='){if(op){cur=clean(calc(acc,op,parseFloat(cur)));op=null;acc=null;fresh=true}}
  else{ // operator
    if(op&&!fresh){cur=clean(calc(acc,op,parseFloat(cur)))}
    acc=parseFloat(cur);op=k;fresh=true;
  }
  render();
}
const layout=[['⌫','f'],['AC','f'],['%','f'],['÷','o'],['7'],['8'],['9'],['×','o'],['4'],['5'],['6'],['−','o'],['1'],['2'],['3'],['+','o'],['±'],['0'],['.'],['=','o']];
layout.forEach(([k,c])=>{const b=document.createElement('button');b.textContent=k;if(c)b.className=c;if(c==='o'&&k!=='=')b.dataset.k=k;b.onclick=()=>press(k);$('pad').appendChild(b)});

function fillSelects(){
  ['u1','u2'].forEach(id=>{$(id).innerHTML=units[cat].map((u,i)=>`<option value="${i}">${u.name} · ${u.code}</option>`).join('')});
  $('u1').selectedIndex=0;$('u2').selectedIndex=Math.min(1,units[cat].length-1);
}
const keys=Object.keys(cats);
keys.forEach(()=>$('dots').appendChild(document.createElement('i')));
function paintHead(){$('hint').textContent=cat==='money'?'ปัดซ้าย/ขวาเปลี่ยนหมวด · แตะรูปเพื่อดู/แชร์':'ปัดซ้าย/ขวาเปลี่ยนหมวด · ปัดขึ้นเพื่อแชร์ลิงก์';$('title').textContent=cats[cat];[...$('dots').children].forEach((d,i)=>d.classList.toggle('on',keys[i]===cat))}
function setCat(dir){
  const i=(keys.indexOf(cat)+dir+keys.length)%keys.length;
  const rows=document.querySelectorAll('.row');
  rows.forEach(r=>r.classList.add(dir>0?'out-l':'out-r'));
  setTimeout(()=>{
    cat=keys[i];fillSelects();paintHead();render();
    rows.forEach(r=>{r.style.transition='none';r.classList.remove('out-l','out-r');r.style.transform=`translateX(${dir>0?40:-40}px)`;r.style.opacity=0});
    requestAnimationFrame(()=>requestAnimationFrame(()=>rows.forEach(r=>{r.style.transition='';r.style.transform='';r.style.opacity=''})));
  },200);
}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}
const CATS={w:'weight',d:'distance',c:'currency'};
function numTok(x){return String(x).replace(/\.$/,'').replace('-','m').replace('.','p')}
function catKey(){return Object.keys(CATS).find(k=>CATS[k]===cat)}
function link(){if(cat==='money')return location.origin+location.pathname+'#m'+($('viewer').classList.contains('open')?'-'+MONEY[vi].replace('.','p'):'');return location.origin+location.pathname+'#'+catKey()+'-'+units[cat][$('u1').selectedIndex].code+'-'+units[cat][$('u2').selectedIndex].code+'-'+numTok(cur)}
function svgCard(){
  const a=units[cat][$('u1').selectedIndex],b=units[cat][$('u2').selectedIndex];
  const out=fmtOut(parseFloat(cur)/a.val*b.val),inp=fmtIn(cur.replace(/\.$/,''));
  const e=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const fs=Math.max(36,Math.min(96,900/Math.max(out.length,1)));
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" font-family="Sukhumvit Set,Noto Sans Thai,sans-serif"><rect width="600" height="340" rx="28" fill="#252627"/><text x="40" y="70" fill="#9a9b9c" font-size="26">${e(cats[cat])} · ${e(inp)} ${e(a.name)}</text><text x="40" y="125" fill="#ff9500" font-size="40">=</text><text x="40" y="225" fill="#fff" font-size="${fs}" font-weight="300">${e(out)}</text><text x="40" y="285" fill="#ff9500" font-size="30">${e(b.name)}</text><text x="560" y="315" fill="#6b6c6d" font-size="16" text-anchor="end">เครื่องแปลงค่า</text></svg>`;
}
function png(){return new Promise(r=>{try{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=1200;c.height=680;c.getContext('2d').drawImage(i,0,0,1200,680);c.toBlob(b=>r(b?new File([b],'result.png',{type:'image/png'}):null))};i.onerror=()=>r(null);i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgCard())}catch(e){r(null)}})}
async function share(img){
  const url=link();
  try{
    if(img){const f=await png();if(f&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'เครื่องแปลงค่า',url});return}}
    if(navigator.share){await navigator.share({title:'เครื่องแปลงค่า',url});return}
  }catch(e){if(e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(url);toast('คัดลอกลิงก์แล้ว')}catch(e){toast('คัดลอกลิงก์จากแถบที่อยู่ได้เลย')}
}
function parseRoute(){
  let m=null;
  try{m=decodeURIComponent(location.pathname).match(/([wdc])=([a-z]+)=([a-z]+)\/(-?\d+(?:\.\d+)?)/i)}catch(e){}
  if(!m){m=location.hash.match(/^#([wdc])-([a-z]+)-([a-z]+)-(m?\d+(?:p\d+)?)/i);if(m){m=[...m];m[4]=m[4].replace('m','-').replace('p','.')}}
  if(!m)return null;
  const c=CATS[m[1].toLowerCase()],a=units[c].findIndex(u=>u.code===m[2].toLowerCase()),b=units[c].findIndex(u=>u.code===m[3].toLowerCase());
  return a<0||b<0?null:{c,a,b,n:m[4]};
}
function parseMoney(){
  let t=null;
  try{const p=decodeURIComponent(location.pathname).match(/(?:^|\/)m(?:\/(\d+(?:\.\d+)?))?\/?$/);if(p)t=p[1]||''}catch(e){}
  if(t===null){const h=location.hash.match(/^#m(?:-(\d+(?:p\d+)?))?$/i);if(h)t=(h[1]||'').replace('p','.')}
  return t===null?null:{i:t?MONEY.indexOf(t):-1};
}
function route(){
  const mr=parseMoney();
  if(mr){cat='money';paintHead();render();$('res').hidden=true;if(mr.i>=0)openViewer(mr.i);return}
  const r=parseRoute();if(!r)return;
  cat=r.c;fillSelects();$('u1').selectedIndex=r.a;$('u2').selectedIndex=r.b;
  cur=r.n;acc=null;op=null;fresh=false;paintHead();render();
  $('card').innerHTML=svgCard();
  $('path').textContent='/'+catKey()+'='+units[cat][r.a].code+'='+units[cat][r.b].code+'/'+cur;
  $('res').hidden=false;
}
let sx,sy,st,sw=false;
const calc_=document.querySelector('.calc');
calc_.addEventListener('pointerdown',e=>{if(e.target.tagName==='SELECT')return;sx=e.clientX;sy=e.clientY;st=Date.now();sw=true});
calc_.addEventListener('pointerup',e=>{
  if(!sw)return;sw=false;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){setCat(dx<0?1:-1);suppress()}
  else if(dy<-60&&Math.abs(dy)>Math.abs(dx)){share();suppress()}
});
calc_.addEventListener('pointercancel',()=>sw=false);
let sup=false;function suppress(){sup=true;setTimeout(()=>sup=false,50)}
calc_.addEventListener('click',e=>{if(sup){e.stopPropagation();e.preventDefault()}},true);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')setCat(-1);else if(e.key==='ArrowRight')setCat(1);else if(e.key==='ArrowUp')share();
});
paintHead();
$('u1').onchange=$('u2').onchange=render;
$('swap').onclick=()=>{const i=$('u1').selectedIndex;$('u1').selectedIndex=$('u2').selectedIndex;$('u2').selectedIndex=i;render()};
document.addEventListener('keydown',e=>{
  const m={'*':'×','/':'÷','-':'−','+':'+','Enter':'=','=':'=','Backspace':'⌫','Escape':'AC','%':'%','.':'.'};
  if(/^\d$/.test(e.key))press(e.key);else if(m[e.key]){e.preventDefault();press(m[e.key])}
});
const MONEY=['0.5','2','3','6','10','20','50','100','400','1000','5000','10000'];
function applyMode(){const m=cat==='money';$('convBody').hidden=m;$('grid').hidden=!m}
$('grid').innerHTML=MONEY.map((m,i)=>`<div class="tile" data-i="${i}" role="img" aria-label="ธนบัตร ${m}"><img src="${m}.png" alt="" draggable="false" loading="lazy"><span class="tag">${m}</span></div>`).join('');
$('grid').addEventListener('click',e=>{const t=e.target.closest('.tile');if(t)openViewer(+t.dataset.i)});
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
const mfiles=new Map();
function moneyFile(i){
  if(!mfiles.has(i))mfiles.set(i,(async()=>{
    const url=MONEY[i]+'.png';
    try{const r=await fetch(url);if(r.ok)return new File([await r.blob()],url,{type:'image/png'})}catch(_){}
    try{const img=await loadImg(url),c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);
      const b=await new Promise((res,rej)=>{try{c.toBlob(x=>x?res(x):rej(),'image/png')}catch(e){rej(e)}});return new File([b],url,{type:'image/png'})}catch(_){return null}
  })());
  return mfiles.get(i);
}
async function shareFile(file,fb){
  try{if(file&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'เครื่องแปลงค่า'});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a'),u=file?URL.createObjectURL(file):fb;a.href=u;a.download=file?file.name:fb;document.body.appendChild(a);a.click();a.remove();
  if(file)setTimeout(()=>URL.revokeObjectURL(u),4000);toast('เบราว์เซอร์นี้แชร์ไม่ได้ จึงบันทึกรูปให้แทน');
}
const viewer=$('viewer'),vimg=$('vimg'),vbg=$('vbg');
let vi=0,busy=false,drag=null,hintShown=false;
function setViewer(i){vi=(i+MONEY.length)%MONEY.length;const src=MONEY[vi]+'.png';vimg.src=src;vbg.style.backgroundImage=`url("${src}")`;vimg.alt='ธนบัตร '+MONEY[vi];moneyFile(vi);try{history.replaceState(null,'','#m-'+MONEY[vi].replace('.','p'))}catch(_){}}
function openViewer(i){setViewer(i);vimg.style.transform='';viewer.classList.add('open');const h=$('vhint');h.style.opacity=1;if(!hintShown){hintShown=true;setTimeout(()=>h.style.opacity=0,3000)}else h.style.opacity=0}
function closeViewer(){viewer.classList.remove('open');vimg.style.transform='';try{history.replaceState(null,'','#m')}catch(_){}}
async function vnav(dir){
  if(busy)return;busy=true;const W=innerWidth;
  const out=vimg.animate([{transform:vimg.style.transform||'none'},{transform:`translateX(${-dir*W}px)`,opacity:.2}],{duration:150,easing:'ease-in',fill:'forwards'});
  await out.finished;vimg.style.transform=`translateX(${dir*W}px)`;out.cancel();setViewer(vi+dir);
  try{await vimg.decode()}catch(_){}
  vimg.style.transform='';
  await vimg.animate([{transform:`translateX(${dir*W}px)`,opacity:.2},{transform:'none',opacity:1}],{duration:200,easing:'ease-out'}).finished;busy=false;
}
async function shareCurrent(){
  if(busy)return;busy=true;
  const a=vimg.animate([{transform:vimg.style.transform||'none'},{transform:'translateY(-14vh)',opacity:.5}],{duration:160,fill:'forwards'});
  const f=await moneyFile(vi);await shareFile(f,MONEY[vi]+'.png');a.cancel();vimg.style.transform='';
  await vimg.animate([{transform:'translateY(8vh)',opacity:.4},{transform:'none',opacity:1}],{duration:200,easing:'ease-out'}).finished;busy=false;
}
function springBack(){vimg.style.transition='transform .2s ease-out';vimg.style.transform='';setTimeout(()=>vimg.style.transition='',220)}
viewer.addEventListener('pointerdown',e=>{if(busy)return;drag={x:e.clientX,y:e.clientY};viewer.setPointerCapture(e.pointerId);vimg.style.transition=''});
viewer.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;vimg.style.transform=Math.abs(dx)>Math.abs(dy)?`translateX(${dx}px)`:`translateY(${dy}px)`});
viewer.addEventListener('pointerup',e=>{
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag=null;const T=60;
  if(Math.abs(dx)>Math.abs(dy)){if(Math.abs(dx)>T)return vnav(dx<0?1:-1)}
  else if(dy<-T)return shareCurrent();else if(dy>T)return closeViewer();
  springBack();
});
viewer.addEventListener('pointercancel',()=>{drag=null;springBack()});
addEventListener('keydown',e=>{
  if(!viewer.classList.contains('open'))return;e.stopImmediatePropagation();
  if(e.key==='ArrowLeft')vnav(-1);else if(e.key==='ArrowRight')vnav(1);else if(e.key==='ArrowUp')shareCurrent();else if(e.key==='ArrowDown'||e.key==='Escape')closeViewer();
},true);
fillSelects();render();route();
window.addEventListener('hashchange',route);
$('bShare').onclick=()=>share(true);
$('bLink').onclick=()=>share(false);
$('bOpen').onclick=()=>{$('res').hidden=true;history.replaceState(null,'',location.pathname)};
</script>
</body>
</html>
