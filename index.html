<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ConvertFT</title> <link rel="icon" type="image/png" href="logo.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#252627;--k:#6b6c6d;--kl:#9a9b9c;--or:#ff9500;--tx:#fff;--dim:#8a8b8c;--page:#111}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--page:#e6e6ea}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--page);font-family:-apple-system,"Sukhumvit Set","Noto Sans Thai",system-ui,sans-serif;color:var(--tx);padding:12px}
.calc{width:100%;max-width:340px;background:var(--bg);border-radius:28px;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.calc{touch-action:none;user-select:none;-webkit-user-select:none;position:relative;overflow:hidden}
.head{text-align:center;margin-bottom:6px}
.title{font-size:16px;color:#ddd;min-height:22px}
.dots{display:flex;justify-content:center;gap:6px;margin:6px 0 2px}
.dots i{width:7px;height:7px;border-radius:50%;background:#4a4b4c;transition:.2s}
.dots i.on{background:var(--or);width:18px;border-radius:4px}
.hint{font-size:11px;color:var(--dim)}
.row{transition:transform .25s,opacity .25s}
.row.out-l{transform:translateX(-40px);opacity:0}.row.out-r{transform:translateX(40px);opacity:0}
.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-80px);background:#fff;color:#111;padding:8px 14px;border-radius:18px;font-size:13px;transition:transform .3s;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
.row{text-align:right;padding:4px 6px}
.num{font-size:48px;font-weight:300;line-height:1.1;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
#top .num{color:#e8e8e8}#bot .num{color:#9d9e9f}
.sel{display:inline-flex;align-items:center;gap:4px;margin-top:2px;color:var(--dim);font-size:14px;position:relative}
.sel select{background:#4a4b4c;color:#ddd;border:0;border-radius:6px;font:inherit;font-size:13px;padding:2px 4px;max-width:200px;cursor:pointer}
.mid{display:flex;align-items:center;gap:10px;margin:6px 6px}
.mid hr{flex:1;border:0;border-top:1px solid #3a3b3c;margin:0}
.swap{background:none;border:0;color:var(--or);font-size:22px;cursor:pointer;padding:0}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.pad button{aspect-ratio:1;border:0;border-radius:50%;background:var(--k);color:#fff;font-size:28px;font-family:inherit;cursor:pointer;transition:filter .1s}
.pad button:active{filter:brightness(1.35)}
.pad .f{background:var(--kl)}.pad .o{background:var(--or);font-size:32px}.pad .o.act{background:#fff;color:var(--or)}
</style>
</head>
<body>
<div class="calc">
  <div class="toast" id="toast"></div>
  <div class="head"><div class="title" id="title"></div><div class="dots" id="dots"></div><div class="hint">ปัดซ้าย/ขวาเปลี่ยนหมวด · ปัดขึ้นเพื่อแชร์ลิงก์</div></div>
  <div class="row" id="top"><div class="num" id="n1">0</div><div class="sel"><select id="u1"></select></div></div>
  <div class="mid"><button class="swap" id="swap" title="สลับ">⇅</button><hr></div>
  <div class="row" id="bot"><div class="num" id="n2">0</div><div class="sel"><select id="u2"></select></div></div>
  <div class="pad" id="pad"></div>
</div>
<script>
const units = {
  weight: [
    { name: 'เจ๋ง', val: 1 },{ name: 'เหรียญ', val: 0.6 },{ name: 'โงบ', val: 1/50 },
    { name: 'เมตริกตัน', val: 1/50 },{ name: 'งอบ', val: 10 },{ name: 'กิโลกรัม', val: 20 },
    { name: 'เงิบ (กรัม)', val: 20000 },{ name: 'ง่อย', val: 20000000 }
  ],
  distance: [
    { name: 'ทาง', val: 1 },{ name: 'เมตร', val: 1000 },{ name: 'ทาบ', val: 100 },
    { name: 'เทียบ', val: 1000 },{ name: 'เซนติเมตร', val: 100000 },{ name: 'เกิบ', val: 10000 }
  ],
  currency: [
    { name: 'เจ๋ง (Ɉ̄)', val: 1 },{ name: 'ดอลลาร์ ($)', val: 0.67 },{ name: 'บาทไทย (฿)', val: 20 }
  ]
};
const cats = {weight:'น้ำหนัก',distance:'ระยะทาง',currency:'สกุลเงิน'};
let cat='weight',cur='0',acc=null,op=null,fresh=false;
const $=id=>document.getElementById(id);
const sym={'÷':'÷','×':'×','−':'−','+':'+'};

function fmtIn(s){const [i,d]=s.split('.');const neg=i[0]==='-';const ii=(neg?i.slice(1):i).replace(/\B(?=(\d{3})+(?!\d))/g,',');return (neg?'-':'')+ii+(d!==undefined?'.'+d:'')}
function fmtOut(x){
  if(!isFinite(x))return 'ผิดพลาด';
  if(x===0)return '0';
  const a=Math.abs(x);
  if(a>=1e15||a<1e-6)return x.toExponential(4);
  let s=x.toLocaleString('en-US',{maximumFractionDigits:6});
  return s;
}
function fit(el){const l=el.textContent.length;el.style.fontSize=(l>12?Math.max(22,48-(l-12)*3):48)+'px'}
function render(){
  $('n1').textContent=fmtIn(cur);
  const v=parseFloat(cur),a=units[cat][$('u1').selectedIndex],b=units[cat][$('u2').selectedIndex];
  $('n2').textContent=fmtOut(v/a.val*b.val);
  fit($('n1'));fit($('n2'));
  document.querySelectorAll('.o[data-k]').forEach(b=>b.classList.toggle('act',fresh&&op===b.dataset.k));
}
function calc(a,o,b){switch(o){case '+':return a+b;case '−':return a-b;case '×':return a*b;case '÷':return b===0?NaN:a/b}}
function clean(n){return isNaN(n)?'0':String(parseFloat(n.toPrecision(12)))}
function press(k){
  if(/^\d$/.test(k)){if(fresh){cur='0';fresh=false}if(cur.replace(/[-.]/g,'').length>=12)return;cur=cur==='0'?k:cur==='-0'?'-'+k:cur+k}
  else if(k==='.'){if(fresh){cur='0';fresh=false}if(!cur.includes('.'))cur+='.'}
  else if(k==='AC'){cur='0';acc=null;op=null;fresh=false}
  else if(k==='⌫'){if(fresh)return;cur=cur.length>1&&!(cur.length===2&&cur[0]==='-')?cur.slice(0,-1):'0'}
  else if(k==='±'){cur=cur==='0'?'0':cur[0]==='-'?cur.slice(1):'-'+cur}
  else if(k==='%'){cur=clean(parseFloat(cur)/100)}
  else if(k==='='){if(op){cur=clean(calc(acc,op,parseFloat(cur)));op=null;acc=null;fresh=true}}
  else{ // operator
    if(op&&!fresh){cur=clean(calc(acc,op,parseFloat(cur)))}
    acc=parseFloat(cur);op=k;fresh=true;
  }
  render();
}
const layout=[['⌫','f'],['AC','f'],['%','f'],['÷','o'],['7'],['8'],['9'],['×','o'],['4'],['5'],['6'],['−','o'],['1'],['2'],['3'],['+','o'],['±'],['0'],['.'],['=','o']];
layout.forEach(([k,c])=>{const b=document.createElement('button');b.textContent=k;if(c)b.className=c;if(c==='o'&&k!=='=')b.dataset.k=k;b.onclick=()=>press(k);$('pad').appendChild(b)});

function fillSelects(){
  ['u1','u2'].forEach(id=>{$(id).innerHTML=units[cat].map((u,i)=>`<option value="${i}">${u.name}</option>`).join('')});
  $('u1').selectedIndex=0;$('u2').selectedIndex=Math.min(1,units[cat].length-1);
}
const keys=Object.keys(cats);
keys.forEach(()=>$('dots').appendChild(document.createElement('i')));
function paintHead(){$('title').textContent=cats[cat];[...$('dots').children].forEach((d,i)=>d.classList.toggle('on',keys[i]===cat))}
function setCat(dir){
  const i=(keys.indexOf(cat)+dir+keys.length)%keys.length;
  const rows=document.querySelectorAll('.row');
  rows.forEach(r=>r.classList.add(dir>0?'out-l':'out-r'));
  setTimeout(()=>{
    cat=keys[i];fillSelects();paintHead();render();
    rows.forEach(r=>{r.style.transition='none';r.classList.remove('out-l','out-r');r.style.transform=`translateX(${dir>0?40:-40}px)`;r.style.opacity=0});
    requestAnimationFrame(()=>requestAnimationFrame(()=>rows.forEach(r=>{r.style.transition='';r.style.transform='';r.style.opacity=''})));
  },200);
}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}
async function share(){
  const p=new URLSearchParams({c:cat,a:$('u1').selectedIndex,b:$('u2').selectedIndex,v:cur});
  const url=location.href.split('#')[0]+'#'+p.toString();
  const text=`${$('n1').textContent} ${units[cat][$('u1').selectedIndex].name} = ${$('n2').textContent} ${units[cat][$('u2').selectedIndex].name}`;
  try{if(navigator.share){await navigator.share({title:'เครื่องแปลงค่า',text,url});return}}catch(e){if(e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(url);toast('คัดลอกลิงก์แล้ว')}catch(e){toast('คัดลอกลิงก์จากแถบที่อยู่ได้เลย')}
}
let sx,sy,st,sw=false;
const calc_=document.querySelector('.calc');
calc_.addEventListener('pointerdown',e=>{if(e.target.tagName==='SELECT')return;sx=e.clientX;sy=e.clientY;st=Date.now();sw=true});
calc_.addEventListener('pointerup',e=>{
  if(!sw)return;sw=false;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){setCat(dx<0?1:-1);suppress()}
  else if(dy<-60&&Math.abs(dy)>Math.abs(dx)){share();suppress()}
});
calc_.addEventListener('pointercancel',()=>sw=false);
let sup=false;function suppress(){sup=true;setTimeout(()=>sup=false,50)}
calc_.addEventListener('click',e=>{if(sup){e.stopPropagation();e.preventDefault()}},true);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')setCat(-1);else if(e.key==='ArrowRight')setCat(1);else if(e.key==='ArrowUp')share();
});
paintHead();
$('u1').onchange=$('u2').onchange=render;
$('swap').onclick=()=>{const i=$('u1').selectedIndex;$('u1').selectedIndex=$('u2').selectedIndex;$('u2').selectedIndex=i;render()};
document.addEventListener('keydown',e=>{
  const m={'*':'×','/':'÷','-':'−','+':'+','Enter':'=','=':'=','Backspace':'⌫','Escape':'AC','%':'%','.':'.'};
  if(/^\d$/.test(e.key))press(e.key);else if(m[e.key]){e.preventDefault();press(m[e.key])}
});
fillSelects();render();
(function restore(){
  try{
    const raw=location.hash.replace(/^#/,'')||location.search.replace(/^\?/,'');
    if(!raw)return;
    const p=new URLSearchParams(raw),c=p.get('c');
    if(!units[c])return;
    cat=c;fillSelects();
    const n=units[c].length,a=+p.get('a'),b=+p.get('b'),v=p.get('v');
    if(a>=0&&a<n)$('u1').selectedIndex=a;
    if(b>=0&&b<n)$('u2').selectedIndex=b;
    if(v&&/^-?\d{1,12}(\.\d*)?$/.test(v))cur=v;
    paintHead();render();
  }catch(e){}
})();
</script>
</body>
</html>
